name: CI

on:
  push:
    # go-runtime 承载 Go 重写（将来拆为独立仓库）；它只影响 go job，
    # 不改动 TS 侧的 ci job 行为。
    branches: [main, go-runtime]
  pull_request:
    branches: [main, go-runtime]

jobs:
  ci:
    runs-on: ubuntu-latest
    # contributors 对账要读 PR 列表（gh pr list）；显式申请只读权限，
    # 不依赖仓库默认 GITHUB_TOKEN 权限档（新仓库默认只有 contents: read）。
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        # engines 钉 24.1.0 且 .npmrc engine-strict=true,低于 24 会在 npm ci 直接被拒
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Contributors ledger check（仅 push main；PR 不因账本漂移提红）
        # 贡献者名单（CONTRIBUTORS.md）以 GitHub PR 列表为数据源，只增不删。
        # 只在 push main 上判红：外部 PR 本身就是待收编对象，不能让它们一提就红；
        # 漂移在下一次 main 推送时兜住。修复在 dev 主仓跑：
        #   npx tsx scripts/contributors.ts --write（润色新条目描述）→ 随 dev 提交 → sync。
        if: github.event_name == 'push'
        run: npm run contributors:check
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: npm run build

  windows-smoke:
    # Real-execution smoke for the Windows command path (Git Bash on the runner).
    # windows-latest ships Git for Windows, so this exercises the actual
    # spawn → stdio pipe → output capture → file side-effect chain that unit
    # tests on Linux cannot reach. Guards the "exit=0, empty stdout" regression.
    # 2026-09-16 起兼作 scripts 层的 Windows 门禁：路径表达式类缺陷（`URL.pathname`
    # 在 Windows 上带前导斜杠，join 后成 `D:\D:\...` → ENOENT）只在 Windows 暴露，
    # 此前没有任何 job 在 Windows 上跑测试文件，只能靠人肉实机跑全量撞。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Windows bash smoke test
        run: node --import tsx --test src/tools/__tests__/bash-windows-smoke.test.ts

      - name: Windows path-expression tests
        # 路径表达式缺陷的 Windows 靶子：`new URL(...).pathname` 在 Windows 上带前导斜杠
        # （`/D:/repo/...`），经 join/readdir/mkdir 成 `D:\D:\...` → ENOENT。scripts 层
        # （swebench-run 的 LOCAL_TMP）与 src 侧（promotion 的 existsSync 判据）各一处。
        run: npx tsx scripts/run-node-tests.ts scripts/ src/context/__tests__/promotion.test.ts

  go:
    # Go 重写版（go/ 子目录）的构建与测试门禁。
    #
    # 为什么需要它：Go 侧引入了第三方依赖（klauspost/compress），
    # 「本地能跑、他人拉取失败」这类问题只在干净环境暴露。本 job 用
    # `-mod=readonly` 构建——它会**拒绝任何需要改 go.mod/go.sum 的情况**，
    # 从而保证提交的依赖清单是完整的。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go/go.mod 的 go 指令，避免硬编码版本漂移
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify dependency manifest
        # go.sum 缺失或不匹配时失败——这是「他人能否复现构建」的直接判据
        run: go mod verify

      - name: Build (readonly modules)
        # -mod=readonly 拒绝隐式改 go.mod/go.sum，暴露漏提交的依赖
        run: GOFLAGS=-mod=readonly go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Check formatting
        # gofmt -l 列出需格式化的文件；有输出即失败
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
